name: SECURITY-031 dependency candidate generator

on:
  pull_request:
    paths:
      - '.github/workflows/deps-031-generate.yml'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Generate supported dependency candidate with npm
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-dev wrangler@4.154.0

      - name: Install exact generated graph without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Record resolved security-sensitive dependency graph
        run: npm ls wrangler miniflare undici zod fast-uri --all > dependency-tree.txt 2>&1 || true

      - name: Audit generated graph at HIGH+
        id: audit
        continue-on-error: true
        run: npm audit --audit-level=high > audit.txt 2>&1

      - name: Upload generated package candidate and bounded evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-031-generated-package-candidate
          if-no-files-found: error
          retention-days: 1
          path: |
            package.json
            package-lock.json
            dependency-tree.txt
            audit.txt

      - name: Require HIGH+ audit pass
        if: ${{ steps.audit.outcome != 'success' }}
        run: |
          echo 'Generated graph still fails npm audit --audit-level=high.'
          exit 1
