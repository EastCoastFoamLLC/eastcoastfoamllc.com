name: SECURITY-031 dependency candidate generator

on:
  pull_request:
    paths:
      - '.github/workflows/deps-031-generate.yml'

permissions:
  contents: write

jobs:
  generate:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'security/deps-031-remediate-20261028' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Move direct Wrangler dependency outside reported vulnerable range
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-dev wrangler@4.154.0

      - name: Apply normal supported audit fixes without force or overrides
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund

      - name: Install exact generated graph without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Record resolved security-sensitive dependency graph
        run: npm ls wrangler miniflare undici zod fast-uri --all > dependency-tree.txt 2>&1 || true

      - name: Audit generated graph at HIGH+
        run: npm audit --audit-level=high > audit.txt 2>&1

      - name: Upload generated package candidate and bounded evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-031-generated-package-candidate
          if-no-files-found: error
          retention-days: 1
          path: |
            package.json
            package-lock.json
            dependency-tree.txt
            audit.txt

      - name: Promote exact generated package files and remove temporary generator
        shell: bash
        run: |
          set -euo pipefail
          rm -f audit.txt dependency-tree.txt
          rm .github/workflows/deps-031-generate.yml
          git add package.json package-lock.json .github/workflows/deps-031-generate.yml

          expected=$'.github/workflows/deps-031-generate.yml\npackage-lock.json\npackage.json'
          actual="$(git diff --cached --name-only | sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo 'Unexpected staged path set; refusing branch write.'
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected" "$actual"
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'SECURITY-031: apply npm-generated dependency remediation'
          git push origin "HEAD:${{ github.head_ref }}"
