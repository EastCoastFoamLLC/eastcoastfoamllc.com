name: ECF production health

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecf-production-health
  cancel-in-progress: true

jobs:
  production-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Allow production deployment to settle
        if: ${{ github.event_name == 'push' }}
        run: sleep 60

      - name: Ensure DNS tooling
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v dig >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq dnsutils
          fi

      - name: Verify HTTPS routes and production markers
        shell: bash
        run: |
          set -euo pipefail
          base="https://eastcoastfoamllc.com"
          tmp="$RUNNER_TEMP/ecf-health"
          user_agent="LDW-Production-Health/1.0"
          mkdir -p "$tmp"

          check_200() {
            local path="$1"
            local name="$2"
            local out="$tmp/$name"
            local code
            code="$(curl --proto '=https' --tlsv1.2 --silent --show-error --location \
              --user-agent "$user_agent" --max-time 20 --output "$out" \
              --write-out '%{http_code}' "$base$path")"
            if [[ "$code" != "200" ]]; then
              echo "::error title=Route health failure::$path returned HTTP $code"
              exit 1
            fi
          }

          check_200 "/" "home.html"
          check_200 "/services" "services.html"
          check_200 "/reviews" "reviews.html"
          check_200 "/get-a-quote" "quote.html"
          check_200 "/contact-us" "contact.html"
          check_200 "/sitemap.xml" "sitemap.xml"
          check_200 "/robots.txt" "robots.txt"

          check_marker() {
            local needle="$1"
            local file="$2"
            local label="$3"
            if ! grep -Fq "$needle" "$file"; then
              echo "::error title=Production marker failure::$label marker was not found"
              echo "Response prefix:"
              head -c 240 "$file" | tr '\n' ' '
              echo
              exit 1
            fi
          }

          check_marker "East Coast Foam" "$tmp/home.html" "homepage identity"
          check_marker "google-review-card" "$tmp/reviews.html" "review cards"
          check_marker "data-estimate-form" "$tmp/quote.html" "guided estimate"
          check_marker "ecfoam@outlook.com" "$tmp/quote.html" "estimate destination"
          check_marker "https://eastcoastfoamllc.com/" "$tmp/sitemap.xml" "sitemap canonical"
          check_marker "Allow: /" "$tmp/robots.txt" "robots allow"
          if grep -q "Disallow: /" "$tmp/robots.txt"; then
            echo "::error title=Indexing regression::robots.txt blocks the production site"
            exit 1
          fi

          read -r www_code www_target < <(
            curl --proto '=https' --tlsv1.2 --silent --show-error --max-time 20 \
              --user-agent "$user_agent" --output /dev/null \
              --write-out '%{http_code} %{redirect_url}\n' \
              "https://www.eastcoastfoamllc.com/"
          )
          case "$www_code" in
            301|302|307|308) ;;
            *)
              echo "::error title=WWW redirect failure::www returned HTTP $www_code"
              exit 1
              ;;
          esac
          if [[ "$www_target" != "https://eastcoastfoamllc.com/" ]]; then
            echo "::error title=WWW canonical failure::unexpected redirect target $www_target"
            exit 1
          fi

          api_code="$(curl --proto '=https' --tlsv1.2 --silent --show-error --max-time 20 \
            --user-agent "$user_agent" --output "$tmp/api.json" \
            --write-out '%{http_code}' "$base/api/estimate")"
          if [[ "$api_code" != "405" ]]; then
            echo "::error title=Estimate API contract failure::GET /api/estimate returned HTTP $api_code instead of 405"
            exit 1
          fi

      - name: Verify production mail DNS
        shell: bash
        run: |
          set -euo pipefail

          mx="$(dig +short MX eastcoastfoamllc.com | tr -s ' ')"
          if ! grep -Eq '^10 mail\.eastcoastfoamllc\.com\.$' <<<"$mx"; then
            echo "::error title=Mail MX regression::expected priority-10 mail.eastcoastfoamllc.com MX record"
            exit 1
          fi

          mail_a="$(dig +short A mail.eastcoastfoamllc.com | head -n 1)"
          if [[ "$mail_a" != "205.209.100.70" ]]; then
            echo "::error title=Mail host regression::mail.eastcoastfoamllc.com resolved to $mail_a"
            exit 1
          fi

          txt="$(dig +short TXT eastcoastfoamllc.com | tr -d '"')"
          if ! grep -Fq "v=spf1 a mx ip4:205.209.100.70 include:relay.mailbaby.net ~all" <<<"$txt"; then
            echo "::error title=SPF regression::expected production SPF record was not found"
            exit 1
          fi

      - name: Report security-header posture
        shell: bash
        run: |
          set -euo pipefail
          headers="$RUNNER_TEMP/ecf-headers.txt"
          curl --proto '=https' --tlsv1.2 --silent --show-error --head --max-time 20 \
            --user-agent "LDW-Production-Health/1.0" \
            https://eastcoastfoamllc.com/ > "$headers"

          for header in strict-transport-security x-content-type-options content-security-policy referrer-policy; do
            if ! grep -qi "^$header:" "$headers"; then
              echo "::warning title=Security header not present::$header is not present on the production homepage"
            fi
          done
